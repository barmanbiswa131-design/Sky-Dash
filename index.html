<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sky-Dash 3D Maze</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#050608;color:#fff;font-family:Arial}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;z-index:5;top:12px;left:14px;font-weight:800;text-shadow:0 2px 7px #000}#hud small{display:block;margin-top:5px;font-weight:400;opacity:.8}#start,#again{position:fixed;z-index:8;left:50%;top:58%;transform:translate(-50%,-50%);padding:16px 30px;border:0;border-radius:14px;background:#39bdf8;color:#001018;font-size:18px;font-weight:900;box-shadow:0 5px 25px #000}#panel{position:fixed;z-index:7;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0008;text-align:center;font-size:30px;font-weight:900}.sub{font-size:14px;font-weight:400;margin-top:10px;opacity:.9}#cross{position:fixed;z-index:4;left:50%;top:50%;width:10px;height:10px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.8}#joy{position:fixed;z-index:6;left:24px;bottom:28px;width:118px;height:118px;border:2px solid #ffffff40;border-radius:50%;background:#ffffff12}#knob{position:absolute;width:44px;height:44px;left:35px;top:35px;border-radius:50%;background:#ffffff55}#look{position:fixed;z-index:3;right:0;top:0;width:65vw;height:100vh}</style></head><body><canvas id="game"></canvas><div id="hud">SKY-DASH 3D • MAZE RUSH<small>Joystick = move • Drag right side = look</small></div><div id="cross"></div><div id="panel">10 PLAYERS READY<span class="sub">First-person maze • Find the real exit</span></div><button id="start">ENTER MAZE</button><div id="joy"><div id="knob"></div></div><div id="look"></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),N=41,FOV=Math.PI/3,TAU=Math.PI*2;let map=[],p={x:1.5,y:1.5,a:0},run=false,win=false,keys={},joy={x:0,y:0};
function resize(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',resize);resize();
function makeMaze(){map=Array.from({length:N},()=>Array(N).fill(1));let s=[[1,1]];map[1][1]=0;while(s.length){let q=s[s.length-1],x=q[0],y=q[1],ds=[[2,0],[-2,0],[0,2],[0,-2]];ds.sort(()=>Math.random()-.5);let done=0;for(let d of ds){let nx=x+d[0],ny=y+d[1];if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&map[ny][nx]){map[y+d[1]/2][x+d[0]/2]=0;map[ny][nx]=0;s.push([nx,ny]);done=1;break}}if(!done)s.pop()}map[N-2][N-2]=0;}
function startGame(){makeMaze();p={x:1.5,y:1.5,a:0};run=true;win=false;panel.style.display='none';start.style.display='none';requestAnimationFrame(loop)}
function wall(x,y){return x<0||y<0||x>=N||y>=N||map[Math.floor(y)][Math.floor(x)]}
function move(dt){let f=0,s=0;if(keys.w||keys.ArrowUp)f++;if(keys.s||keys.ArrowDown)f--;if(keys.a||keys.ArrowLeft)s--;if(keys.d||keys.ArrowRight)s++;f+=-joy.y;s+=joy.x;if(!f&&!s)return;let len=Math.hypot(f,s)||1;f/=len;s/=len;let speed=3.2*dt,ca=Math.cos(p.a),sa=Math.sin(p.a),dx=(ca*f-sa*s)*speed,dy=(sa*f+ca*s)*speed;if(!wall(p.x+dx,p.y))p.x+=dx;if(!wall(p.x,p.y+dy))p.y+=dy;let ex=N-1.5,ey=N-1.5;if(Math.hypot(p.x-ex,p.y-ey)<1){win=true;run=false;panel.innerHTML='ESCAPED! 🏆<span class="sub">You found the real exit.</span>';panel.style.display='flex';start.style.display='block';start.textContent='NEW MAZE'}}
function cast(a){let rx=Math.cos(a),ry=Math.sin(a),mx=Math.floor(p.x),my=Math.floor(p.y),ddx=Math.abs(1/(rx||1e-9)),ddy=Math.abs(1/(ry||1e-9)),sx=rx<0?-1:1,sy=ry<0?-1:1,sxD=rx<0?(p.x-mx)*ddx:(mx+1-p.x)*ddx,syD=ry<0?(p.y-my)*ddy:(my+1-p.y)*ddy,side=0;for(let i=0;i<100;i++){if(sxD<syD){sxD+=ddx;mx+=sx;side=0}else{syD+=ddy;my+=sy;side=1}if(wall(mx,my))break}let d=side===0?(mx-p.x+(1-sx)/2)/(rx||1e-9):(my-p.y+(1-sy)/2)/(ry||1e-9);return Math.max(.001,Math.abs(d))}
function draw(t){let w=cv.width,h=cv.height;ctx.fillStyle='#080b10';ctx.fillRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,0,h/2);g.addColorStop(0,'#05070a');g.addColorStop(1,'#111821');ctx.fillStyle=g;ctx.fillRect(0,0,w,h/2);ctx.fillStyle='#0a0d11';ctx.fillRect(0,h/2,w,h/2);let rays=Math.min(w,900),step=w/rays;for(let i=0;i<rays;i++){let a=p.a-FOV/2+(i/rays)*FOV,d=cast(a)*Math.cos(a-p.a),bh=Math.min(h*2,h/(d*.82)),y=h/2-bh/2;let shade=Math.max(18,115-d*3.2);ctx.fillStyle=`rgb(${shade*.42|0},${shade*.52|0},${shade*.62|0})`;ctx.fillRect(i*step,y,step+1,bh)}let ex=N-1.5,ey=N-1.5,ea=Math.atan2(ey-p.y,ex-p.x),diff=Math.atan2(Math.sin(ea-p.a),Math.cos(ea-p.a));if(Math.abs(diff)<FOV*.55){let d=Math.hypot(ex-p.x,ey-p.y),sx=w/2+Math.tan(diff)/Math.tan(FOV/2)*w/2,sz=Math.min(h*.55,h/(d*.7));ctx.fillStyle='#20e070';ctx.globalAlpha=Math.max(.2,1-d/35);ctx.fillRect(sx-12,y=h/2-sz/2,24,sz);ctx.globalAlpha=1}/* arms */ctx.fillStyle='#b88462';ctx.beginPath();ctx.ellipse(w*.37,h*.94,w*.075,h*.16,0,0,TAU);ctx.ellipse(w*.63,h*.94,w*.075,h*.16,0,0,TAU);ctx.fill();ctx.fillStyle='#202832';ctx.fillRect(w*.31,h*.91,w*.12,h*.09);ctx.fillRect(w*.57,h*.91,w*.12,h*.09)}
let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(run)move(dt);draw(now);if(run)requestAnimationFrame(loop)}
addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
let drag=0,lx=0;look.addEventListener('pointerdown',e=>{drag=1;lx=e.clientX});addEventListener('pointerup',()=>drag=0);addEventListener('pointermove',e=>{if(drag&&run){p.a+=(e.clientX-lx)*.006;lx=e.clientX}});
let active=0;joy.addEventListener('pointerdown',e=>{active=1;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(active)setJoy(e)});joy.addEventListener('pointerup',()=>{active=0;joy.x=joy.y=0;knob.style.transform='translate(0,0)'});function setJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+59),dy=e.clientY-(r.top+59),m=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m/42;joy.y=Math.sin(a)*m/42;knob.style.transform=`translate(${joy.x*42}px,${joy.y*42}px)`}
start.onclick=startGame;makeMaze();draw(0);</script></body></html>
