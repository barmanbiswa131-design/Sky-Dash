<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sky-Dash 3D Maze</title><style>html,body{margin:0;overflow:hidden;background:#05070b;font-family:Arial;color:#fff}#hud{position:fixed;z-index:5;top:12px;left:12px;text-shadow:0 2px 8px #000;font-weight:700}#msg{position:fixed;z-index:6;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.62);font-size:30px;font-weight:800;pointer-events:none}.sub{display:block;font-size:15px;margin-top:12px;font-weight:400}#start{position:fixed;z-index:8;left:50%;top:55%;transform:translate(-50%,-50%);padding:16px 28px;border:0;border-radius:14px;font-size:19px;font-weight:800;background:#38bdf8;color:#001018}#cross{position:fixed;z-index:5;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;opacity:.8}#look{position:fixed;z-index:4;right:0;top:0;width:65vw;height:100vh}#stick{position:fixed;z-index:7;left:22px;bottom:28px;width:110px;height:110px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff38}#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffff55}.hint{font-size:12px;opacity:.8;margin-top:5px}</style></head>
<body><div id="hud">SKY-DASH 3D • MAZE RUSH<div class="hint">Move: WASD / joystick • Look: drag right side</div></div><div id="cross"></div><div id="msg">10 PLAYERS READY<span class="sub">Find the real exit. The maze is huge.</span></div><button id="start">ENTER MAZE</button><div id="look"></div><div id="stick"><div id="knob"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>
let scene,camera,renderer,maze,player,started=false,won=false;const N=41,C=5,WALL=8;let yaw=0,pitch=0,keys={};let joy={x:0,y:0};
function makeMaze(){let a=Array.from({length:N},()=>Array(N).fill(1)),s=[[1,1]];a[1][1]=0;while(s.length){let [x,y]=s[s.length-1],ds=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),ok=0;for(const[dX,dY]of ds){let nx=x+dX,ny=y+dY;if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&a[ny][nx]){a[y+dY/2][x+dX/2]=0;a[ny][nx]=0;s.push([nx,ny]);ok=1;break}}if(!ok)s.pop()}a[N-2][N-2]=0;return a}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x05070b);scene.fog=new THREE.Fog(0x05070b,18,75);camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,150);camera.rotation.order='YXZ';renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const amb=new THREE.HemisphereLight(0x9bbcff,0x111111,1.1);scene.add(amb);const light=new THREE.PointLight(0xffffff,1.8,35);light.position.set(5,4,5);scene.add(light);maze=makeMaze();build();player={x:1.5,y:1.7,z:1.5};camera.position.set(player.x,player.y,player.z);addEventListener('resize',resize);loop()}
function build(){const wallMat=new THREE.MeshStandardMaterial({color:0x29313c,roughness:.88});const floorMat=new THREE.MeshStandardMaterial({color:0x10151c,roughness:1});const geo=new THREE.BoxGeometry(C,WALL,C);for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(maze[y][x]){let m=new THREE.Mesh(geo,wallMat);m.position.set(x*C+2.5,WALL/2,y*C+2.5);m.castShadow=true;m.receiveShadow=true;scene.add(m)}let fg=new THREE.PlaneGeometry(N*C,N*C),fm=new THREE.Mesh(fg,floorMat);fm.rotation.x=-Math.PI/2;fm.position.set(N*C/2,0,N*C/2);fm.receiveShadow=true;scene.add(fm);let exit=new THREE.Mesh(new THREE.BoxGeometry(3.5,4.5,.5),new THREE.MeshStandardMaterial({color:0x20e070,emissive:0x073d1b,emissiveIntensity:2}));exit.position.set((N-1.5)*C,2.25,(N-1.5)*C);scene.add(exit);let l=new THREE.PointLight(0x20ff80,4,20);l.position.copy(exit.position);scene.add(l)}
function blocked(nx,nz){let gx=Math.floor(nx/C),gz=Math.floor(nz/C);return gx<0||gz<0||gx>=N||gz>=N||maze[gz][gx]===1}
function move(){let speed=.075,fx=0,fz=0;if(keys.w||keys.ArrowUp)fz-=1;if(keys.s||keys.ArrowDown)fz+=1;if(keys.a||keys.ArrowLeft)fx-=1;if(keys.d||keys.ArrowRight)fx+=1;fx+=joy.x;fz+=joy.y;if(!fx&&!fz)return;let l=Math.hypot(fx,fz)||1;fx/=l;fz/=l;let sx=Math.cos(yaw)*fx+Math.sin(yaw)*fz,sz=-Math.sin(yaw)*fx+Math.cos(yaw)*fz;let nx=player.x+sx*speed,nz=player.z+sz*speed;if(!blocked(nx,player.z))player.x=nx;if(!blocked(player.x,nz))player.z=nz;camera.position.set(player.x,player.y,player.z);let ex=(N-1.5)*C,ez=(N-1.5)*C;if(Math.hypot(player.x-ex,player.z-ez)<3.2&&!won){won=true;msg.innerHTML='ESCAPED! 🏆<span class="sub">You found the real exit.</span>';msg.style.display='flex';start.style.display='block';start.textContent='NEW MAZE'}}
function loop(){requestAnimationFrame(loop);if(started&&!won)move();camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});let lx=0,ly=0,drag=false;look.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag||!started)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.004;pitch=Math.max(-1.35,Math.min(1.35,pitch-dy*.004))});
let active=false;stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId)});stick.addEventListener('pointermove',e=>{if(!active)return;let r=stick.getBoundingClientRect(),cx=r.left+55,cy=r.top+55,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.min(38,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*d/38;joy.y=Math.sin(a)*d/38;knob.style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`});stick.addEventListener('pointerup',()=>{active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'});
start.onclick=()=>{if(won){location.reload();return}started=true;start.style.display='none';msg.style.display='none';document.documentElement.requestFullscreen?.().catch(()=>{})};init();</script></body></html>
