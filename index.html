<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sky-Dash 3D Maze</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#050608;color:#fff;font-family:Arial}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;z-index:5;top:12px;left:14px;font-weight:800;text-shadow:0 2px 7px #000}#hud small{display:block;margin-top:5px;font-weight:400;opacity:.8}#start{position:fixed;z-index:8;left:50%;top:58%;transform:translate(-50%,-50%);padding:16px 30px;border:0;border-radius:14px;background:#39bdf8;color:#001018;font-size:18px;font-weight:900;box-shadow:0 5px 25px #000}#panel{position:fixed;z-index:7;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0008;text-align:center;font-size:30px;font-weight:900}.sub{font-size:14px;font-weight:400;margin-top:10px;opacity:.9}#cross{position:fixed;z-index:4;left:50%;top:50%;width:10px;height:10px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.8}#joy{position:fixed;z-index:6;left:24px;bottom:28px;width:122px;height:122px;border:2px solid #ffffff40;border-radius:50%;background:#ffffff12}#knob{position:absolute;width:46px;height:46px;left:36px;top:36px;border-radius:50%;background:#ffffff55}#look{position:fixed;z-index:3;right:0;top:0;width:62vw;height:100vh}#run{position:fixed;z-index:7;right:24px;bottom:35px;width:88px;height:88px;border:2px solid #ffffff45;border-radius:50%;background:#f59e0b;color:#17100a;font-weight:900;font-size:16px;box-shadow:0 5px 20px #0008;touch-action:none}#run.on{background:#22c55e;transform:scale(1.06)}#status{position:fixed;z-index:6;right:25px;bottom:132px;font-size:12px;font-weight:800;text-shadow:0 2px 5px #000;opacity:.85}</style></head><body><canvas id="game"></canvas><div id="hud">SKY-DASH 3D • MAZE RUSH<small>Left joystick = move • Right side = look • RUN = sprint</small></div><div id="cross"></div><div id="panel">10 PLAYERS READY<span class="sub">FIRST-PERSON HUMAN • Find the real exit</span></div><button id="start">ENTER MAZE</button><div id="joy"><div id="knob"></div></div><div id="look"></div><div id="status">WALK</div><button id="run">RUN</button><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),N=51,FOV=Math.PI/3,TAU=Math.PI*2;let map=[],p={x:1.5,y:1.5,a:0},runGame=false,win=false,keys={},joy={x:0,y:0},sprint=false;
function resize(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',resize);resize();
function makeMaze(){map=Array.from({length:N},()=>Array(N).fill(1));let s=[[1,1]];map[1][1]=0;while(s.length){let q=s[s.length-1],x=q[0],y=q[1],ds=[[2,0],[-2,0],[0,2],[0,-2]];ds.sort(()=>Math.random()-.5);let done=0;for(let d of ds){let nx=x+d[0],ny=y+d[1];if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&map[ny][nx]){map[y+d[1]/2][x+d[0]/2]=0;map[ny][nx]=0;s.push([nx,ny]);done=1;break}}if(!done)s.pop()}map[N-2][N-2]=0}
function startGame(){makeMaze();p={x:1.5,y:1.5,a:0};runGame=true;win=false;panel.style.display='none';start.style.display='none';requestAnimationFrame(loop)}
function wall(x,y){return x<0||y<0||x>=N||y>=N||map[Math.floor(y)][Math.floor(x)]}
function move(dt){let f=0,s=0;if(keys.w||keys.ArrowUp)f++;if(keys.s||keys.ArrowDown)f--;if(keys.a||keys.ArrowLeft)s--;if(keys.d||keys.ArrowRight)s++;f+=-joy.y;s+=joy.x;if(!f&&!s)return;let len=Math.hypot(f,s)||1;f/=len;s/=len;let speed=(sprint||keys.Shift?5.8:3.0)*dt,ca=Math.cos(p.a),sa=Math.sin(p.a),dx=(ca*f-sa*s)*speed,dy=(sa*f+ca*s)*speed;if(!wall(p.x+dx,p.y)&&!wall(p.x+dx,p.y+.28)&&!wall(p.x+dx,p.y-.28))p.x+=dx;if(!wall(p.x,p.y+dy)&&!wall(p.x+.28,p.y+dy)&&!wall(p.x-.28,p.y+dy))p.y+=dy;let ex=N-1.5,ey=N-1.5;if(Math.hypot(p.x-ex,p.y-ey)<1){win=true;runGame=false;panel.innerHTML='ESCAPED! 🏆<span class="sub">You found the real exit first.</span>';panel.style.display='flex';start.style.display='block';start.textContent='NEW MAZE'}}
function cast(a){let rx=Math.cos(a),ry=Math.sin(a),mx=Math.floor(p.x),my=Math.floor(p.y),ddx=Math.abs(1/(rx||1e-9)),ddy=Math.abs(1/(ry||1e-9)),sx=rx<0?-1:1,sy=ry<0?-1:1,sxD=rx<0?(p.x-mx)*ddx:(mx+1-p.x)*ddx,syD=ry<0?(p.y-my)*ddy:(my+1-p.y)*ddy,side=0;for(let i=0;i<150;i++){if(sxD<syD){sxD+=ddx;mx+=sx;side=0}else{syD+=ddy;my+=sy;side=1}if(wall(mx,my))break}let d=side===0?(mx-p.x+(1-sx)/2)/(rx||1e-9):(my-p.y+(1-sy)/2)/(ry||1e-9);return Math.max(.001,Math.abs(d))}
function draw(){let w=cv.width,h=cv.height;ctx.fillStyle='#06080c';ctx.fillRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h*.52);sky.addColorStop(0,'#030509');sky.addColorStop(1,'#18202a');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h*.52);let floor=ctx.createLinearGradient(0,h*.52,0,h);floor.addColorStop(0,'#111820');floor.addColorStop(1,'#030406');ctx.fillStyle=floor;ctx.fillRect(0,h*.52,w,h*.48);let rays=Math.min(w,1100),step=w/rays;for(let i=0;i<rays;i++){let a=p.a-FOV/2+(i/rays)*FOV,d=cast(a)*Math.cos(a-p.a),bh=Math.min(h*2,h/(d*.78)),y=h/2-bh/2;let shade=Math.max(16,125-d*3.4);ctx.fillStyle=`rgb(${shade*.43|0},${shade*.53|0},${shade*.63|0})`;ctx.fillRect(i*step,y,step+1,bh)}let ex=N-1.5,ey=N-1.5,ea=Math.atan2(ey-p.y,ex-p.x),diff=Math.atan2(Math.sin(ea-p.a),Math.cos(ea-p.a));if(Math.abs(diff)<FOV*.52){let d=Math.hypot(ex-p.x,ey-p.y),sx=w/2+Math.tan(diff)/Math.tan(FOV/2)*w/2,sz=Math.min(h*.65,h/(d*.65));ctx.save();ctx.shadowBlur=25;ctx.shadowColor='#20e070';ctx.fillStyle='#20e070';ctx.globalAlpha=Math.max(.2,1-d/45);ctx.fillRect(sx-14,h/2-sz/2,28,sz);ctx.restore();ctx.globalAlpha=1}
// visible first-person human body: shoulders, arms, hands and legs at bottom
let bob=runGame?Math.sin(performance.now()*.012*(sprint?1.8:1))*(sprint?5:2):0;ctx.save();ctx.translate(0,bob);ctx.fillStyle='#202936';ctx.beginPath();ctx.moveTo(w*.38,h);ctx.lineTo(w*.43,h*.82);ctx.lineTo(w*.57,h*.82);ctx.lineTo(w*.62,h);ctx.fill();ctx.fillStyle='#a96f4f';ctx.beginPath();ctx.ellipse(w*.37,h*.88,w*.055,h*.12,0,0,TAU);ctx.ellipse(w*.63,h*.88,w*.055,h*.12,0,0,TAU);ctx.fill();ctx.fillStyle='#151b23';ctx.beginPath();ctx.moveTo(w*.42,h*.83);ctx.lineTo(w*.49,h*.83);ctx.lineTo(w*.48,h);ctx.lineTo(w*.38,h);ctx.fill();ctx.beginPath();ctx.moveTo(w*.51,h*.83);ctx.lineTo(w*.58,h*.83);ctx.lineTo(w*.62,h);ctx.lineTo(w*.52,h);ctx.fill();ctx.restore();if(sprint){ctx.fillStyle='#22c55e';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('SPRINT',w/2,h*.72);ctx.textAlign='left'}}
let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(runGame)move(dt);draw();if(runGame)requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='Shift')sprint=true});addEventListener('keyup',e=>{keys[e.key]=0;if(e.key==='Shift')sprint=false});
let drag=0,lx=0;look.addEventListener('pointerdown',e=>{drag=1;lx=e.clientX});addEventListener('pointerup',()=>drag=0);addEventListener('pointermove',e=>{if(drag&&runGame){p.a+=(e.clientX-lx)*.006;lx=e.clientX}});
let active=0;joy.addEventListener('pointerdown',e=>{active=1;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(active)setJoy(e)});joy.addEventListener('pointerup',()=>{active=0;joy.x=joy.y=0;knob.style.transform='translate(0,0)'});function setJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+61),dy=e.clientY-(r.top+61),m=Math.min(44,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m/44;joy.y=Math.sin(a)*m/44;knob.style.transform=`translate(${joy.x*44}px,${joy.y*44}px)`}
run.addEventListener('pointerdown',e=>{e.preventDefault();sprint=true;run.classList.add('on');status.textContent='SPRINT'});['pointerup','pointercancel','pointerleave'].forEach(ev=>run.addEventListener(ev,()=>{sprint=false;run.classList.remove('on');status.textContent='WALK'}));start.onclick=startGame;makeMaze();draw();</script></body></html>
