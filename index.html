<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Maze Rush</title><style>html,body{margin:0;background:#070a10;color:#fff;font-family:Arial;overflow:hidden}#ui{position:fixed;z-index:2;top:8px;left:12px;font-weight:bold}canvas{display:block;width:100vw;height:100vh}#btn{position:fixed;z-index:3;bottom:20px;left:50%;transform:translateX(-50%);padding:14px 28px;border:0;border-radius:14px;background:#46beff;font-weight:bold;font-size:18px}</style></head><body><div id="ui">MAZE RUSH • 10 PLAYERS</div><canvas id="c"></canvas><button id="btn">START MATCH</button><script>
const c=document.getElementById('c'),x=c.getContext('2d'),btn=document.getElementById('btn');let N=151,walls,px,py,ex,ey,state=0,seed=0,seen=[],fake=[],traps=[];
function maze(){walls=Array.from({length:N},()=>Array(N).fill(1));let st=[[1,1]];walls[1][1]=0;while(st.length){let a=st[st.length-1],ds=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),ok=false;for(let d of ds){let nx=a[0]+d[0],ny=a[1]+d[1];if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&walls[ny][nx]){walls[a[1]+d[1]/2][a[0]+d[0]/2]=0;walls[ny][nx]=0;st.push([nx,ny]);ok=true;break}}if(!ok)st.pop()}ex=N-2;ey=N-2;walls[ey][ex]=0;fake=[];traps=[];for(let i=0;i<30;i++){let a=2+Math.floor(Math.random()*(N-4));let b=2+Math.floor(Math.random()*(N-4));if(!walls[a][b])fake.push([b,a]);}for(let i=0;i<180;i++){let a=1+Math.floor(Math.random()*(N-2));let b=1+Math.floor(Math.random()*(N-2));if(!walls[a][b]&&!(b==1&&a==1)&&!(b==ex&&a==ey))traps.push([b,a]);}}
function start(){maze();px=1;py=1;state=1;btn.style.display='none';setTimeout(()=>state=2,1800);draw()}
function free(a,b){return a>=0&&b>=0&&a<N&&b<N&&!walls[Math.round(b)][Math.round(a)]}
function move(dx,dy){if(state!==2)return;let nx=px+dx,ny=py+dy;if(free(nx,ny)){px=nx;py=ny;if(Math.round(px)==ex&&Math.round(py)==ey){state=3;btn.textContent='NEW MATCH';btn.style.display='block'}}draw()}
function draw(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let W=innerWidth,H=innerHeight,cell=Math.max(9,Math.min(W,H)/13),ox=W/2-px*cell-cell/2,oy=H/2-py*cell-cell/2;x.fillStyle='#070a10';x.fillRect(0,0,W,H);let r=Math.ceil(W/cell/2)+2,t=Math.ceil(H/cell/2)+2;for(let yy=Math.max(0,Math.floor(py)-t);yy<Math.min(N,Math.floor(py)+t);yy++)for(let xx=Math.max(0,Math.floor(px)-r);xx<Math.min(N,Math.floor(px)+r);xx++){x.fillStyle=walls[yy][xx]?'#1f2734':'#0c1119';x.fillRect(ox+xx*cell,oy+yy*cell,cell-1,cell-1)}x.fillStyle='#32dc78';x.fillRect(ox+ex*cell,oy+ey*cell,cell,cell);fake.forEach(q=>{if(Math.abs(q[0]-px)<r&&Math.abs(q[1]-py)<t){x.fillStyle='#e8b84b';x.fillRect(ox+q[0]*cell+cell*.2,oy+q[1]*cell+cell*.2,cell*.6,cell*.6)}});traps.forEach(q=>{if(Math.abs(q[0]-px)<r&&Math.abs(q[1]-py)<t){x.fillStyle='#a43c4a';x.fillRect(ox+q[0]*cell+cell*.3,oy+q[1]*cell+cell*.3,cell*.4,cell*.4)}});x.fillStyle='#50aaff';x.beginPath();x.arc(ox+(px+.5)*cell,oy+(py+.5)*cell,cell*.32,0,7);x.fill();if(state==1||state==3){x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 38px Arial';x.fillText(state==1?'GET READY':'ESCAPED!',W/2,H/2);x.font='18px Arial';x.fillText(state==1?'Find the real green exit':'You found the exit!',W/2,H/2+38);x.textAlign='left'}}
addEventListener('resize',draw);addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move(0,-1);if(e.key==='ArrowDown'||e.key==='s')move(0,1);if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);if(e.key==='ArrowRight'||e.key==='d')move(1,0)});let sx,sy;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))});btn.onclick=start;draw();</script></body></html>
